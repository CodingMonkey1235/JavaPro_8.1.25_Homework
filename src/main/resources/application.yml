spring:
  datasource:
    url: jdbc:postgresql://localhost/Javapro_Homework
    username: ash
    password:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none # Options: none, update, create, create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true # Set to false in production
        format_sql: false # Set to false in production
    open-in-view: false # Recommended for better performance and transaction management
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: '0'
    url: jdbc:postgresql://localhost/Javapro_Homework
    username: ash
    password:
    locations: classpath:db/migration
